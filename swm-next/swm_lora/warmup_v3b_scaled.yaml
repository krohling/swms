# exp4b trajectory-adapter warm-up, SCALED recipe (exp1's treatment) on the
# v3b k=8 eval-ladder uniform-pick dataset. See warmup_v3a_scaled.yaml for
# recipe notes; the noscale run on this data (warmup_v3b.yaml) feeds exp4d.
model_id: Qwen/Qwen3-VL-8B-Instruct
action_dim: 5
horizon: 16
h5_paths: [datasets_swm/bg_v3b_k8uni_s60000.h5]
diffusion_ckpt: ckpts/ogbench_base_diffusion/blue_cube_green_cube.pt
questions: planner
val_frac: 0.05
micro_cycles: 2
accum_cycles: 6                # eff 12 lists/step, exp1 geometry
proj_init_scale: 0.1
learnable_scale: true          # exp1's learnable gain
proj_hidden: 512
traj_cumsum: true
learning_rate: 1.0e-4          # FIXED — no schedule in warm-up
max_steps: 6000
max_grad_norm: 1.0
val_every: 50
ckpt_every: 250
seed: 0
device: cuda
wandb_project: swm-lora
run_name: warmup-v3b-scaled
out_dir: outputs_swm_lora/exp4b_warmup_v3b_scaled
