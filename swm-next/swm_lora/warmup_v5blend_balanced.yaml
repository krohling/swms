# exp5b trajectory-adapter warm-up on the PAPER-BLEND set (Kevin 2026-11-13/14):
# warmup_v5_balanced.yaml (exp5a's balanced warm-up, wu5b) with only the data
# changed — 2,100 of the labeled v5 play episodes (seeds 70000-72099) + 2,100
# new noisy episodes (seeds 80000-82099, datagen_v5_ogbnoisy.yaml), the
# paper's 50/50 play/noisy blend at exp5a's size (4,200 episodes). Projector
# only, no LoRA, fixed LR, balance_labels ON (every question x class cell
# drawn with equal probability). episode_split stratifies by policy flag, so
# val holds 105 play + 105 noisy episodes.
# PICK RULE (same as wu5b): argmin of val_bce_balanced over saved ckpts;
# extend one 2h gh-dev leg via init_projector only if the smoothed balanced
# tail is still falling at the wall. train_exp5b.yaml's init_projector is
# wired at pick-lock and exp5b is submitted then — never submit-and-hold.
model_id: Qwen/Qwen3-VL-8B-Instruct
action_dim: 5
horizon: 16
h5_paths:
  - datasets_swm/bg_v5_ogbplay_s70000_n2100.h5
  - datasets_swm/bg_v5_ogbnoisy_s80000.h5
diffusion_ckpt: ckpts/ogbench_base_diffusion/blue_cube_green_cube.pt
questions: planner
val_frac: 0.05
micro_cycles: 2
accum_cycles: 6                # eff 12 lists/step, exp1 geometry
learnable_scale: false         # winning noscale recipe: no scalar, tokens at 1x
proj_hidden: 512
traj_cumsum: true
balance_labels: true           # ON (Kevin 2026-11-08) — see header
balance_threshold: 0.5
learning_rate: 1.0e-4          # FIXED — no schedule in warm-up
max_steps: 6000
max_grad_norm: 1.0
val_every: 100
val_max_lists: 600
ckpt_every: 250
seed: 0
device: cuda
wandb_project: swm-lora
run_name: warmup-v5blend-noscale-balanced
out_dir: outputs_swm_lora/exp5b_warmup_v5blend_balanced
