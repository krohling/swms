# Experiment 2c-84k (team call 2026-10-30): fresh full-budget rerun of the
# cold-LoRA listwise selector. Kevin: cancel the wedged 30k run's successors
# and restart with exp2's training budget ("~84k steps; overtraining is ok").
# Identical to train_exp2c.yaml except:
#   - epochs 3 -> 8.45: total_steps = int(8.45 * ~10,023 steps/epoch) ~ 84,694,
#     matching exp1's 84,687-step budget (exp1b's 80,367 would be epochs 8.02)
#   - ckpt_every 1000 -> 2000: keeps the eval grid {16k, 42k, 64k, final}
#     divisible while holding the ~84k-run checkpoint footprint to ~9 GB
#   - fresh out_dir + run_name (old exp2c_full artifacts stay for the record)
model_id: Qwen/Qwen3-VL-8B-Instruct
action_dim: 5
horizon: 16
k: 8
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_targets: all-linear
h5_paths: [datasets_swm/bg_hybrid_v2_k8_r10.h5]
diffusion_ckpt: ckpts/ogbench_base_diffusion/blue_cube_green_cube.pt
val_frac: 0.05
epochs: 8.45
micro_lists: 4                 # 4 cycles/forward (1 image + 128 traj tokens each)
accum_lists: 4                 # eff 16 cycles per opt step (run5b-proven on GH200)
loss: listwise
tau: 0.1                       # target softmax temp ~ 2x teacher JND (|dp| ~ 0.05)
proj_hidden: 512
traj_cumsum: true
learnable_scale: false
# init_adapters: (none)        # cold LoRA, as in the 30k run
init_encoder: outputs_swm_lora/warmup_sel/ckpt_step6000 # selection-warmed projector+cand_embed
learning_rate: 1.0e-4
warmup_frac: 0.03
max_grad_norm: 1.0
val_every: 500
val_max_cycles: 200
ckpt_every: 2000
resume_every: 500
seed: 0
device: cuda
wandb_project: swm-lora
run_name: exp2c-selector-coldlora-84k
out_dir: outputs_swm_lora/exp2c_84k
