# exp4a trajectory-adapter warm-up: the winning noscale recipe (no scalar
# gain — learnable_scale false, tokens at 1x; see warmup_noscale.yaml) on the
# v3a k=1 tau=1.0 dataset, so exp4a's warm start derives from its own
# training data exactly as exp1's did (Kevin, 2026-11-05). Projector only,
# no LoRA, fixed LR; pick the loss-plateau checkpoint (exp1 lineage used
# step 1500) and point train_exp4a.yaml init_projector at it. Within-cycle
# Spearman val is degenerate at k=1 — watch val BCE.
model_id: Qwen/Qwen3-VL-8B-Instruct
action_dim: 5
horizon: 16
h5_paths: [datasets_swm/bg_v3a_k1tau1_s42000.h5]
diffusion_ckpt: ckpts/ogbench_base_diffusion/blue_cube_green_cube.pt
questions: planner
val_frac: 0.05
micro_cycles: 2
accum_cycles: 6                # eff 12 lists/step, exp1 geometry
learnable_scale: false         # winning noscale recipe: no scalar, tokens at 1x
proj_hidden: 512
traj_cumsum: true
learning_rate: 1.0e-4          # FIXED — no schedule in warm-up
max_steps: 6000
max_grad_norm: 1.0
val_every: 50
ckpt_every: 250
seed: 0
device: cuda
wandb_project: swm-lora
run_name: warmup-v3a-noscale
out_dir: outputs_swm_lora/exp4a_warmup_v3a
