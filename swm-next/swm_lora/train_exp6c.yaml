# Experiment 6c (Kevin 2026-11-20, submitted 2026-11-24): exp6a's recipe on the
# 8x v3b set, the interim run of the 16x expansion (trained as soon as the 8x
# set verified, without waiting for 16x).
#
# Changes vs train_exp6a.yaml, nothing else:
#   h5_paths   the 4x set + batches 0-7 of datagen_v3b_x16_m5.sh (seeds
#              120000-141599; same recipe, each batch verified). 43,200
#              episodes; exp4b's 270 val episodes stay the whole val set.
#   run_name, out_dir
# 7.7M draws over about 3M train examples is about 2.6 passes (exp6a: about 5).
model_id: Qwen/Qwen3-VL-8B-Instruct
action_dim: 5
horizon: 16
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_targets: all-linear       # q/k/v/o + gate/up/down (~45M trainable)
h5_paths:
  - datasets_swm/bg_v3b_k8uni_s60000.h5
  - datasets_swm/bg_v3b_k8uni_s100000.h5
  - datasets_swm/bg_v3b_k8uni_s102700.h5
  - datasets_swm/bg_v3b_k8uni_s105400.h5
  - datasets_swm/bg_v3b_k8uni_s108100.h5
  - datasets_swm/bg_v3b_k8uni_s110800.h5
  - datasets_swm/bg_v3b_k8uni_s113500.h5
  - datasets_swm/bg_v3b_k8uni_s120000.h5
  - datasets_swm/bg_v3b_k8uni_s122700.h5
  - datasets_swm/bg_v3b_k8uni_s125400.h5
  - datasets_swm/bg_v3b_k8uni_s128100.h5
  - datasets_swm/bg_v3b_k8uni_s130800.h5
  - datasets_swm/bg_v3b_k8uni_s133500.h5
  - datasets_swm/bg_v3b_k8uni_s136200.h5
  - datasets_swm/bg_v3b_k8uni_s138900.h5
diffusion_ckpt: ckpts/ogbench_base_diffusion/blue_cube_green_cube.pt
questions: planner
fixed_val_split: swm-next/swm_lora/splits/exp4b_split.json
total_steps: 80367
micro_cycles: 16
accum_cycles: 6                # eff 96 examples/step (exp1b: 12 lists x 8)
learnable_scale: false         # fixed 1x tokens (exp1b/exp4 standard)
proj_hidden: 512
traj_cumsum: true
init_projector: outputs_swm_lora/exp4b_warmup_v3b/ckpt_step5250
learning_rate: 1.0e-4          # exp1b's value at this batch size
warmup_frac: 0.03
max_grad_norm: 1.0
val_every: 1000
val_max_lists: 2000
ckpt_every: 1000
resume_every: 500
seed: 0
device: cuda
wandb_project: swm-lora
run_name: exp6c-v3b8x-b96
out_dir: outputs_swm_lora/exp6c_full
