# Experiment 5a: exp4a's exact recipe on "the paper's data" — v5 OGBench-
# ORACLE PLAY episodes (Jacob's collect_demos.py, run unchanged on seeds
# 70000+; Jacob confirmed by email 2026-08-04 that the paper regenerated its
# OGBench data this way and never used the public npz), labeled by OUR Qwen
# teacher with v3a's three planner probes. See
# swm-next/configs/datagen_v5_ogbplay.yaml for the dataset recipe.
#
# Hypothesis (Kevin, 2026-11-06): the paper's oracle play data trains a
# better SWM than our diffusion-policy rollouts (v3a). Vs exp4a ONLY the data
# SOURCE varies. Label balance (FULL set, 4,200 eps / 193,200 cycles,
# 2026-11-07): the judge's positives (p>0.5) are 16.3% place / 18.2% approach
# — sparser than the 20-episode smoke suggested (21% / 23%) and below v3a's
# 26% / 20% on place — while simulator truth is sparser still (3.3%
# blue-on-green, 10.7% grasped at window end); the judge answers "grasping" /
# "on top" more permissively than the simulator (AUC vs truth 0.86 / 0.96).
# The paper's per-type true/false balancing (balance_labels, implemented)
# stays OFF so that vs exp4a only the data source varies; flip it on for a
# follow-up arm if the sparser place positives look like the limiting factor.
# Trainer index: 3,990 / 210 episodes -> 367,080 train / 19,320 val lists
# (exp4a: 366,034 / 19,242). Oracle actions reach the clip on dim 0 where the
# diffusion ckpt's amin is -0.962, so normalized trajs dip to -1.04 (benign).
# Pre-registered caveats: oracle per-step actions are ~1.5-2x larger on xyz
# than diffusion proposals and the gripper command is graded (|g|<0.5 on 89%
# of steps) vs the policy's +-1 — a covariate shift at deployment that the
# paper's SWM tolerated (scored diffusion proposals at 76 suite).
# Budget: 367,080 lists / 12 per step x 3 epochs = 91,770 steps (exp4a:
# 91,506) — matched to exp4a.
# Pre-registered success gate (same as team-exp4): peak block-A suite within
# ~1 s.e. (~4) of exp1's 54.7 AND >=3 over control 46.7; winner gets a
# block-B leg. Warm-up pick judged on plain val BCE as for wu4a
# (val_bce_balanced is logged alongside as a sparsity check).
model_id: Qwen/Qwen3-VL-8B-Instruct
action_dim: 5
horizon: 16
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_targets: all-linear       # q/k/v/o + gate/up/down (~45M trainable)
h5_paths: [datasets_swm/bg_v5_ogbplay_s70000.h5]
diffusion_ckpt: ckpts/ogbench_base_diffusion/blue_cube_green_cube.pt
questions: planner
val_frac: 0.05
epochs: 3
micro_cycles: 2
accum_cycles: 6                # eff 12 cycles/step, exp1 geometry
learnable_scale: false         # fixed 1x tokens (exp1b/exp4 standard)
proj_hidden: 512
traj_cumsum: true
balance_labels: false          # OFF: one variable vs exp4a (see header)
balance_threshold: 0.5
init_projector: outputs_swm_lora/exp5a_warmup_v5/ckpt_step5000
# ^ PICK-LOCKED 2026-11-08 (wu5 = Vista job 1129710 on gh-dev, ran 05:03-07:03
# CT to step 5660 at the 2h wall; plain val BCE argmin over the saved ckpts,
# the wu4a rule): ckpt_step5000 @ 0.3927 (runners-up 1500: 0.3953, 500:
# 0.3954; last saved 5500: 0.3988). The curve is a plateau at 0.39-0.40 from
# step 100, with a transient bump to 0.44-0.47 over steps 2700-4200 and a
# return to the plateau by 4900; the 7-pt smoothed tail read 0.3941 @5500 ->
# 0.3949 @5600 (flat, no new lows), so the extend-one-leg rule was NOT
# triggered. Context: the prior-only BCE at 16.5% positives is 0.448 and
# val_bce_balanced sat at 0.62-0.65 (chance 0.693) with pos/neg BCE 0.95 /
# 0.29 at the end - the projector-only stage separates v5 labels weakly,
# weaker than wu4a's 0.407 against a 0.54 prior on v3a. The sbatch refuses to
# start while this line is commented out (INIT_PICK_NOT_LOCKED).
learning_rate: 1.0e-4
warmup_frac: 0.03
max_grad_norm: 1.0
val_every: 500
val_max_lists: 600             # ~25-50 positives per pass (v3a used 200)
ckpt_every: 1000
resume_every: 500
seed: 0
device: cuda
wandb_project: swm-lora
run_name: exp5a-ogbplay
out_dir: outputs_swm_lora/exp5a_full
