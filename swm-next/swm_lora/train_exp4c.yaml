# Experiment 4c: exp4a's data (v3a) with the NOSCALE adapter treatment —
# the exp1b/post-deep-eval standard: no-scale warm-up (fixed 1x buffer) and
# learnable_scale false in the main run. Paired ablation for exp4a (exp1's
# scaled treatment): a-vs-c isolates projector scaling on identical data,
# which the historical record never had (exp1 v1-scaled vs exp1b v2-noscale
# varied data and treatment together; they tied). Same pre-registered gate
# as exp4a; primary comparison is exp4a vs exp4c.
# PREPARED 2026-11-05, NOT YET SUBMITTED (pending Kevin's go).
# init_projector: set to the v3a noscale warmup plateau (wu4a, ran
# 2026-11-05) at submission: outputs_swm_lora/exp4a_warmup_v3a/ckpt_stepN.
model_id: Qwen/Qwen3-VL-8B-Instruct
action_dim: 5
horizon: 16
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_targets: all-linear       # q/k/v/o + gate/up/down (~45M trainable)
h5_paths: [datasets_swm/bg_v3a_k1tau1_s42000.h5]
diffusion_ckpt: ckpts/ogbench_base_diffusion/blue_cube_green_cube.pt
questions: planner
val_frac: 0.05
epochs: 3
micro_cycles: 2
accum_cycles: 6                # eff 12 cycles/step, exp1 geometry
learnable_scale: false         # fixed 1x tokens (exp1b standard): no gain
proj_hidden: 512
traj_cumsum: true
learning_rate: 1.0e-4
warmup_frac: 0.03
max_grad_norm: 1.0
val_every: 500
val_max_lists: 200
ckpt_every: 1000
resume_every: 500
seed: 0
device: cuda
wandb_project: swm-lora
run_name: exp4c-v3a-k1tau1-noscale
out_dir: outputs_swm_lora/exp4c_full
