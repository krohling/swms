# Experiment 6d (Kevin 2026-11-26): exp6a's recipe on the full 16x v3b set, at
# twice exp6c's step count.
#
# Changes vs train_exp6c.yaml, nothing else:
#   h5_paths     + batches 8-23 of the 16x expansion: 8-15 from
#                datagen_v3b_x16_m5.sh (seeds 141600-163199), 16-23 from the
#                Vista generation jobs (seeds 163200-184799); same recipe, each
#                batch verified. 86,400 episodes; exp4b's 270 val episodes stay
#                the whole val set.
#   total_steps  160734 = 2 x 80367. Twice the data at twice the steps: about
#                2.5 passes, as in exp6c, and the cosine spans total_steps, so
#                the checkpoint at step 2N here pairs with exp6c's at step N
#                (same passes over the data, same learning rate).
#   run_name, out_dir
model_id: Qwen/Qwen3-VL-8B-Instruct
action_dim: 5
horizon: 16
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_targets: all-linear       # q/k/v/o + gate/up/down (~45M trainable)
h5_paths:
  - datasets_swm/bg_v3b_k8uni_s60000.h5
  - datasets_swm/bg_v3b_k8uni_s100000.h5
  - datasets_swm/bg_v3b_k8uni_s102700.h5
  - datasets_swm/bg_v3b_k8uni_s105400.h5
  - datasets_swm/bg_v3b_k8uni_s108100.h5
  - datasets_swm/bg_v3b_k8uni_s110800.h5
  - datasets_swm/bg_v3b_k8uni_s113500.h5
  - datasets_swm/bg_v3b_k8uni_s120000.h5
  - datasets_swm/bg_v3b_k8uni_s122700.h5
  - datasets_swm/bg_v3b_k8uni_s125400.h5
  - datasets_swm/bg_v3b_k8uni_s128100.h5
  - datasets_swm/bg_v3b_k8uni_s130800.h5
  - datasets_swm/bg_v3b_k8uni_s133500.h5
  - datasets_swm/bg_v3b_k8uni_s136200.h5
  - datasets_swm/bg_v3b_k8uni_s138900.h5
  - datasets_swm/bg_v3b_k8uni_s141600.h5
  - datasets_swm/bg_v3b_k8uni_s144300.h5
  - datasets_swm/bg_v3b_k8uni_s147000.h5
  - datasets_swm/bg_v3b_k8uni_s149700.h5
  - datasets_swm/bg_v3b_k8uni_s152400.h5
  - datasets_swm/bg_v3b_k8uni_s155100.h5
  - datasets_swm/bg_v3b_k8uni_s157800.h5
  - datasets_swm/bg_v3b_k8uni_s160500.h5
  - datasets_swm/bg_v3b_k8uni_s163200.h5
  - datasets_swm/bg_v3b_k8uni_s165900.h5
  - datasets_swm/bg_v3b_k8uni_s168600.h5
  - datasets_swm/bg_v3b_k8uni_s171300.h5
