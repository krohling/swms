# exp4a trajectory-adapter warm-up, SCALED recipe — exp1's exact treatment
# (warmup_encoder.yaml lineage: learnable gain, init 0.1; exp1's plateau pick
# was step 1500, whose ckpt carried scale 0.1045). Same v3a data and
# instrumentation as warmup_v3a.yaml — that noscale run feeds exp4c instead.
# Plateau-pick convention: val BCE min before the train/val gap opens
# (exp1: 0.567 @ 1500).
model_id: Qwen/Qwen3-VL-8B-Instruct
action_dim: 5
horizon: 16
h5_paths: [datasets_swm/bg_v3a_k1tau1_s42000.h5]
diffusion_ckpt: ckpts/ogbench_base_diffusion/blue_cube_green_cube.pt
questions: planner
val_frac: 0.05
micro_cycles: 2
accum_cycles: 6                # eff 12 lists/step, exp1 geometry
proj_init_scale: 0.1
learnable_scale: true          # THE difference vs warmup_v3a.yaml: exp1's gain
proj_hidden: 512
traj_cumsum: true
learning_rate: 1.0e-4          # FIXED — no schedule in warm-up
max_steps: 6000
max_grad_norm: 1.0
val_every: 50
ckpt_every: 250
seed: 0
device: cuda
wandb_project: swm-lora
run_name: warmup-v3a-scaled
out_dir: outputs_swm_lora/exp4a_warmup_v3a_scaled
