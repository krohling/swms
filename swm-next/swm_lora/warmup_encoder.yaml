# Encoder warm-up (projector only, no LoRA, fixed LR). Watch wandb for the
# loss plateau and pick a checkpoint; max_steps is a generous ceiling.
model_id: Qwen/Qwen3-VL-8B-Instruct
action_dim: 5
horizon: 16
h5_paths: [datasets_swm/bg_hybrid_k8_s30000.h5, datasets_swm/bg_hybrid_k8_s31000.h5,
           datasets_swm/bg_hybrid_k8_s32100.h5, datasets_swm/bg_hybrid_k8_s33200.h5,
           datasets_swm/bg_hybrid_k8_s34300.h5]
diffusion_ckpt: ckpts/ogbench_base_diffusion/blue_cube_green_cube.pt
questions: planner
val_frac: 0.05
micro_cycles: 2
accum_cycles: 6                # eff 12 lists/step, same geometry as run4
proj_init_scale: 0.1
proj_hidden: 512               # set to null for the 1-layer encoder ablation
traj_cumsum: true
learning_rate: 1.0e-4          # FIXED — no schedule in warm-up
max_steps: 20000
max_grad_norm: 1.0
val_every: 500
ckpt_every: 500
seed: 0
device: cuda
wandb_project: swm-lora
run_name: exp1-warmup-encoder
out_dir: outputs_swm_lora/exp1_warmup
