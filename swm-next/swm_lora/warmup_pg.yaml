# PaliGemma projector warm-up (branch paligemma-fullft): the winning Qwen
# warm-up recipe replicated on the PaliGemma backbone — uniform weighting
# (every weighted arm lost, deep eval 2026-10-23), NO scalar (PaliGemmaSWM is
# always fixed-1x), run to completion and take the FINAL checkpoint (no
# early-stop benefit), on the v2 R10-filtered dataset.
backbone: paligemma
base_model: google/paligemma-3b-pt-224
processor_path: ckpts/paligemma_wm_ogbench
action_dim: 5
horizon: 16
h5_paths: [datasets_swm/bg_hybrid_v2_k8_r10.h5]
diffusion_ckpt: ckpts/ogbench_base_diffusion/blue_cube_green_cube.pt
questions: planner
val_frac: 0.05
micro_cycles: 2
accum_cycles: 6                # eff 12 lists/step, same geometry as the Qwen arms
proj_hidden: 512
traj_cumsum: true
weighting: none
learning_rate: 1.0e-4          # FIXED — no schedule in warm-up
max_steps: 6000
max_grad_norm: 1.0
val_every: 50
ckpt_every: 250
seed: 0
device: cuda
wandb_project: swm-lora
run_name: warmup-pg-noscale
out_dir: outputs_swm_lora/warmup_pg
