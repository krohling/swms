# Experiment 4a: exp1's recipe on the v3a robot-faithful k=1 dataset
# (execute-and-label-one, tau=1.0, seeds 42000+, collected m5 2026-11-02/04),
# with the NOSCALE adapter treatment (Kevin, 2026-11-05 final): no-scale
# warm-up on v3a + fixed-1x gain in the main run — exp1b's exact recipe, the
# post-deep-eval standard (scaling already ablated: deep eval 2026-10-23
# noscale won every offline metric; exp1b tied exp1 closed-loop). Clean
# anchor: vs exp1b only the dataset varies (v2 -> v3a). Trainer is pointwise
# soft-BCE and k=1-safe; within-cycle Spearman val is degenerate at k=1.
# Steps: ~366k train lists (192.6k cycles x 2 planner questions, 95% split)
# x 3 epochs / 12 lists-per-step ~ 91.5k (exp1: 84k). Each k=1 list is a
# single candidate, not an 8-list, so steps are ~8x lighter than exp1's.
# Pre-registered success gate (team-exp4): peak block-A suite within ~1 s.e.
# (~4) of exp1's 54.7 AND >=3 over control 46.7; winner gets a block-B leg.
model_id: Qwen/Qwen3-VL-8B-Instruct
action_dim: 5
horizon: 16
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_targets: all-linear       # q/k/v/o + gate/up/down (~45M trainable)
h5_paths: [datasets_swm/bg_v3a_k1tau1_s42000.h5]
diffusion_ckpt: ckpts/ogbench_base_diffusion/blue_cube_green_cube.pt
questions: planner
val_frac: 0.05
epochs: 3
micro_cycles: 2
accum_cycles: 6                # eff 12 cycles/step, exp1 geometry
learnable_scale: false         # fixed 1x tokens (exp1b standard): no gain;
                               # matches the noscale warm-up it loads.
proj_hidden: 512
traj_cumsum: true
init_projector: outputs_swm_lora/exp4a_warmup_v3a/ckpt_step5500
# ^ wu4a (1124070) val-BCE argmin over saved ckpts: 0.4071 @ 5500 (4250:
# 0.4090, 4500: 0.4095 — all within noise). Curve flat from ~3000 in a
# 0.40-0.42 band, so the extend-if-falling rule did NOT trigger; no ext leg.
# Picked 2026-11-05.
learning_rate: 1.0e-4
warmup_frac: 0.03
max_grad_norm: 1.0
val_every: 500
val_max_lists: 200
ckpt_every: 1000
resume_every: 500
seed: 0
device: cuda
wandb_project: swm-lora
run_name: exp4a-v3a-k1tau1
out_dir: outputs_swm_lora/exp4a_full
