# Run 4: pointwise BCE, cycle-grouped batching, branched hybrid data.
# Baseline to beat: run-3 within-cycle rho ~0.13 (0.14 late).
model_id: Qwen/Qwen3-VL-8B-Instruct
action_dim: 5
horizon: 16
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
h5_paths: [datasets_swm/bg_hybrid_k8_s30000.h5, datasets_swm/bg_hybrid_k8_s31350.h5,
           datasets_swm/bg_hybrid_k8_s32700.h5, datasets_swm/bg_hybrid_k8_s34050.h5]
diffusion_ckpt: ckpts/ogbench_base_diffusion/blue_cube_green_cube.pt
questions: planner             # trainer is file-driven; planner-only this run
val_frac: 0.05
epochs: 3
micro_cycles: 2                # 2 cycles x k=8 = 16 proposal-forwards/micro
accum_cycles: 6                # eff 12 lists = 96 proposals per opt step
lambda_rank: 0.0               # pointwise; listwise escalation if rho flatlines
rank_temperature: 1.0
proj_init_scale: 0.1
learning_rate: 1.0e-4
warmup_frac: 0.03
max_grad_norm: 1.0
val_every: 500
val_max_lists: 200
ckpt_every: 1000
resume_every: 500
seed: 0
device: cuda
wandb_project: swm-lora
run_name: run4-hybrid-k8-pointwise
out_dir: outputs_swm_lora/run4_hybrid
