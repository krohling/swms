# Experiment 5b (Kevin 2026-11-13/14): the PAPER-BLEND set, trained in the
# k=8 pointwise run's sample regime (Kevin 2026-11-16: 96 examples per step).
# exp5a's data (v5) is all oracle PLAY; the paper trained on 50/50
# noisy + play episodes (300 + 300, pooled, sampling balanced over question
# type x answer). exp5b = 2,100 of exp5a's labeled play episodes (seeds
# 70000-72099, bg_v5_ogbplay_s70000_n2100.h5) + 2,100 new NOISY episodes
# (collect_demos.py --dataset-type noisy: Markov oracle, Gaussian action
# noise, 10% random actions; seeds 80000-82099; same judge, same three
# probes; swm-next/configs/datagen_v5_ogbnoisy.yaml). Same episode and label
# count as exp5a.
# Trainer index: 3,990 / 210 episodes (1,995 + 1,995 train, 105 + 105 val by
# policy stratum) -> 367,080 train / 19,320 val examples.
# Batch regime = exp6a's (and exp1b's, the 54.7 run): micro 16 x accum 6 =
# 96 examples per optimizer step for 80,367 steps, so the 16k/42k/64k
# checkpoints compare with exp6a's and exp1b's at equal draws. That is 7.7M
# draws, about 21 passes over this set (exp5a: 12 per step x 91,770 steps =
# 1.1M draws, 3 passes; exp6a: about 4.9 passes over its 1.56M examples).
# So vs exp5a both the play/noisy composition AND the batch regime differ.
# balance_labels ON in both stages, as exp5a. Warm-up: own-data balanced
# warm-up at 12 examples/step (warmup_v5blend_balanced.yaml), pick = argmin
# val_bce_balanced; exp6a also started from a 12/step warm-up pick.
# Success gate: the team-exp4 gate (peak block-A suite within ~1 s.e. of
# 54.7 AND >=3 over control 46.7).
model_id: Qwen/Qwen3-VL-8B-Instruct
action_dim: 5
horizon: 16
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_targets: all-linear       # q/k/v/o + gate/up/down (~45M trainable)
h5_paths:
  - datasets_swm/bg_v5_ogbplay_s70000_n2100.h5
  - datasets_swm/bg_v5_ogbnoisy_s80000.h5
diffusion_ckpt: ckpts/ogbench_base_diffusion/blue_cube_green_cube.pt
questions: planner
val_frac: 0.05
total_steps: 80367             # = exp6a / exp1b
micro_cycles: 16
accum_cycles: 6                # eff 96 examples/step (exp1b: 12 lists x 8)
learnable_scale: false         # fixed 1x tokens (exp1b/exp4 standard)
proj_hidden: 512
traj_cumsum: true
balance_labels: true           # as exp5a: balanced warm-up -> balanced main stage
balance_threshold: 0.5
init_projector: outputs_swm_lora/exp5b_warmup_v5blend_balanced_larg/ckpt_step5500
# ^ PICK-LOCKED 2026-11-16 from the balanced blend warm-up run on LARG
# (aaronson GPU 0, larg-scripts/launch_warmup_v5blend.sh, 6000 steps at 12
# examples/step; the Vista copy 1147408 was cancelled before it started):
# argmin of val_bce_balanced over saved ckpts = ckpt_step5500 @ 0.5291 (plain
# val BCE 0.480; runners-up 3500: 0.5364, 5000: 0.5414; last saved 6000:
# 0.5416). The LARG venv runs transformers 5.12.1 (Vista: 4.57.1); scorer
# parity between the two was measured on exp4b@64k (|dp| <= 0.012).
# projector.pt md5 939f399c21b08a17335983fef9f1661a (LARG = m5 = Vista).
learning_rate: 1.0e-4          # exp1b's value at this batch size
warmup_frac: 0.03
max_grad_norm: 1.0
val_every: 500
val_max_lists: 600             # as exp5a
ckpt_every: 1000
resume_every: 500
seed: 0
device: cuda
wandb_project: swm-lora
run_name: exp5b-ogbblend-b96
out_dir: outputs_swm_lora/exp5b_full
