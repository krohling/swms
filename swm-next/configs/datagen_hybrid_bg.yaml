# Hybrid dataset recipe (run-4 training data): branched k=8 with JND-calibrated
# diversity enforcement, 50/50 verifier/random selection for deep+wide state
# coverage, planner questions only (aux addable post-hoc from stored end
# frames via a pure judge pass if the aux ablation warrants it).
device: mps                    # Vista sbatch sed-overrides to cuda
seed_start: 30000              # fresh range; 6000-6099 eval / 10000-22799 used
block_combo: [blue_cube, green_cube]
diffusion_path: ckpts/ogbench_base_diffusion/blue_cube_green_cube.pt
max_cycles: 50
actions_per_cycle: 4
arm_alpha: 0.1
model_id: Qwen/Qwen3-VL-8B-Instruct
batch: 8

generation:
  k: 8
  lookahead: 16
  frac_random: 0.5             # 50% verifier-selected
                               # 50% random-selected
  min_sep: 0.05                # teacher-JND calibrated (|dp| floor ~0.05)
