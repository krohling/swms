# v5 dataset recipe (exp5 — "the paper's data"): OGBench-ORACLE PLAY episodes
# generated by Jacob's collect_demos.py (krohling/ogbench fork, run unchanged:
# `--dataset-type play --num-episodes 4200 --seed-offset 70000`), converted to
# the v3 cycle schema by swm-next/verifier/convert_ogb_v5.py and labeled by
# OUR Qwen teacher with v3a's exact three planner probes. Only the data SOURCE
# changes vs exp4a (oracle play vs diffusion-policy rollouts); questions,
# window length (16), window cadence (stride 4 = actions_per_cycle), judge,
# gate/score constants and the trainer are all v3a's.
#
# Provenance: Jacob B. email 2026-08-04 — the paper did NOT use the public
# OGBench npz datasets; it regenerated oracle play/noisy data with this script
# (paper A.3.1: 300 episodes/type, seeds 0-299, 200 steps). Script defaults
# (noise 0.1, smoothing 0.5, min_norm 0.4, p_random_action 0 for play,
# p_stack ~ U(0.1, 0.5), 224 px, control_timestep 0.1) are untouched; the env
# renders OGBench's default semi-transparent arm (alpha 0.1 / pad 0.5) — the
# same alphas our make_env(arm_alpha=0.1) uses for v3a and for closed-loop eval.
#
# Known differences to name in the pre-registration: oracle per-step actions
# are ~1.5-2x larger on xyz than diffusion proposals and the gripper command is
# graded (not +-1); positives are sparse (blue-on-green stacking ~1% of windows
# vs v3a's ~26% place p>0.5) — the paper handled this with per-type
# true/false-balanced sampling (Jacob's MultiHorizonSWMDataset), which exp5a's
# trainer config must mirror.
device: mps                    # LARG/Vista override to cuda
seed_start: 70000              # v5 range 70000-74199 (4,200 eps x 46 windows ~ 193k
                               # cycles ~ v3a's 192,638). Taken elsewhere: 6000-6099
                               # eval / 10000-10799 / 12000-22799 / 30000-35399 /
                               # 40000-40999 / 42000+ v3a / 50000-56499 v2 /
                               # 60000+ v3b / 90000+ smoke (v5 smoke: 90200-90219)
episodes: 4200
block_combo: [blue_cube, green_cube]
arm_alpha: 0.1                 # documentation only — frames come from collect_demos
model_id: Qwen/Qwen3-VL-8B-Instruct
judge_batch: 24                # probes per forward (3 per window); MPS-sized

collect:                       # mirrors collect_demos.py main() — for the record
  script: ogbench/collect_demos.py
  dataset_type: play
  env: visual-cube-quadruple-v0
  max_episode_steps: 200
  noise: 0.1
  noise_smoothing: 0.5
  min_norm: 0.4
  p_random_action: 0.0
  p_stack: "U(0.1, 0.5)"
  control_timestep: 0.1
  width: 224
  height: 224

window:
  horizon: 16
  stride: 4
  start: 1                     # frame 0 is the pre-settle reset frame
