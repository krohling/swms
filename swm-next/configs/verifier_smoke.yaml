# Verifier-planning experiment (Kevin, 2026-08-23): can zero-shot Qwen select
# successful base-policy rollouts? Local run (macOS/MPS); harness validated by
# base-policy sanity eval reproducing the cluster's 52% exactly.
out_dir: outputs_verifier_smoke
device: mps

# rollouts (Stage A)
seed_start: 6000
num_seeds: 5
k_rollouts: 8
block_combo: [blue_cube, green_cube]
diffusion_path: ckpts/ogbench_base_diffusion/blue_cube_green_cube.pt
max_cycles: 50                 # matches eval protocol num_steps
capture_workers: 4             # parallel rollout workers (1 = sequential)
arm_alpha: 0.1                 # arm opacity; 0.1 = OGBench default, 1.0 = opaque
actions_per_cycle: 4           # matches eval protocol num_actions_executed

# verification (Stage B)
model_id: Qwen/Qwen3-VL-8B-Instruct
batch: 8               # judge forward-pass batch size (sweep)


# ---- sweep (verifier/sweep.py): judge scoring, no metrics ----
stride: 4              # eval positions every N env steps
h_values: [4, 8, 16]   # window widths for pair questions, env steps
questions:
  - {name: grasp,   text: "Is the robot grasping the {top}?"}
  - {name: ontop,   text: "Is the {top} on top of the {bottom}?"}
  - {name: stacked, text: "Is the {top} stacked on top of the {bottom}?"}
  - name: progress
    pair: true
    text: "The robot was instructed to: {instruction}. Is the robot closer to completing this task than in the first image?"

# ---- analysis (verifier/analyze.py): offline, edit freely ----
composites:
  - name: phase1_planning
    aggregate: current
    terms:
      - {q: ontop, weight: 0.6}
      - {q: grasp, weight: 0.4}
  - name: stacked_current
    aggregate: current
    terms:
      - {q: stacked, weight: 1.0}
  - name: progress_h8_cum
    aggregate: cumulative
    h: 8
    terms:
      - {q: progress, weight: 1.0}
