# DinoWM predictor, BCE arm (Kevin, 2026-08-13) — binary cross-entropy on the
# renormalized yes/no pair probability (sigmoid of the pooled logit margin,
# exactly p_yes()). Single-variable change vs predictor_ce.yaml: the answer
# loss shape — no gradient reaches vocab entries outside the yes/no pools.
run_name: dinowm-bce-64m-v1
out_dir: /scratch/cluster/krohling/swm-next/runs/dinowm-bce-64m-v1

# data — identical to the reproduction (corrected SAQA HDF5s)
noisy_hdf5: /scratch/cluster/krohling/swm-next/data/noisy.hdf5
play_hdf5:  /scratch/cluster/krohling/swm-next/data/play.hdf5
val_frac: 0.1                  # same held-out trajectories as repro.yaml

# model — the substitution: frozen Qwen3-VL ViT + 64M OneShotPredictor
model_id: Qwen/Qwen3-VL-8B-Instruct
output_stage: pre_merger
image_size: 224                # recipe resolution (PaliGemma is 224)
action_dim: 5                  # A.3.1
max_horizon: 20                # A.3.2: horizons sampled 0-20 (h=0 included)
obs_horizon: 2                 # DinoWM architecture: two-frame history
depth: 6                       # 64M predictor
heads: 16
mlp_dim: 2048
dropout: 0.1
objective: bce
cos_weight: 0.0                # pure BCE — no cosine term

# training — recipe protocol (A.1/A.2); LR and precision are model-specific
bf16: false                    # cosine/ce arms diverged under bf16 at 5e-4;
                               # fp32 per Kevin 2026-08-09
max_steps: 64000
effective_batch: 96
micro_batch: 48                # A100 probe: bs=48 -> 47.9 GiB, 23.7 samples/s
learning_rate: 5.0e-4          # upstream DinoWM predictor_lr (not the VLM 1e-5)
max_grad_norm: 1.0             # explicit, mirroring repro.yaml
weight_decay: 0.0              # explicit, mirroring repro.yaml
warmup_steps: 0
workers: 8
seed: 0

# bookkeeping — 4k grid for the planning-eval curve, as in the reproduction
eval_every: 4000
eval_samples: 1200             # same balanced probe size as repro.yaml
logging_steps: 50
save_steps: 4000
save_total_limit: 16           # keep every checkpoint for planning evals
wandb_project: swm-repro
